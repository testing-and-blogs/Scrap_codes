<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Your Projects</h1>
            <!-- In a real app, this would link to a "New Project" form -->
            <a href="#" class="btn btn-primary">New Migration Project</a>
        </div>

        {% if projects %}
            <div class="list-group">
                {% for project in projects %}
                    <a href="{% url 'ui:project_detail' project.id %}" class="list-group-item list-group-item-action">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">{{ project.name }}</h5>
                            <small>{{ project.created_at|date:"Y-m-d" }}</small>
                        </div>
                        <p class="mb-1">Owner: {{ project.owner.username }}</p>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info" role="alert">
                You don't have any projects yet.
            </div>
        {% endif %}
    </div>
</body>
</html>
